name: Update and release protocol

on:
  repository_dispatch:
    types: [protocol-update]
  workflow_dispatch:
    inputs:
      protocol_sha:
        description: Full ProtocolDefinitions commit SHA from master
        required: true
        type: string
      version:
        description: Exact version already published by the upstream package workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-protocol
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.revision.outputs.tag }}
      prerelease: ${{ steps.revision.outputs.prerelease }}
      skip: ${{ steps.revision.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: true
          fetch-depth: 0

      - name: Pin the upstream revision and validate the shared version
        id: revision
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha || inputs.protocol_sha }}
          PACKAGE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Expected a full commit SHA"; exit 1; }
          git -C ProtocolDefinitions fetch origin
          git -C ProtocolDefinitions merge-base --is-ancestor "$REQUESTED_SHA" origin/master || {
            echo "The requested revision must belong to ProtocolDefinitions master"
            exit 1
          }
          CURRENT_SHA=$(git -C ProtocolDefinitions rev-parse HEAD)
          git -C ProtocolDefinitions checkout --detach "$REQUESTED_SHA"
          REQUESTED_SHA=$(git -C ProtocolDefinitions rev-parse HEAD)
          python3 scripts/validate-version.py "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/v$PACKAGE_VERSION"; then
            [[ "$(git rev-parse "refs/tags/v$PACKAGE_VERSION:ProtocolDefinitions")" == "$REQUESTED_SHA" ]] || {
              echo "That version already refers to a different protocol revision"
              exit 1
            }
            echo "existing_commit=$(git rev-parse "refs/tags/v$PACKAGE_VERSION^{commit}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$CURRENT_SHA" != "$REQUESTED_SHA" ]] && git -C ProtocolDefinitions merge-base --is-ancestor "$REQUESTED_SHA" "$CURRENT_SHA"; then
            echo "Ignoring an older protocol update; the default branch has already advanced"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.revision.outputs.skip != 'true' && steps.revision.outputs.existing_commit == ''

      - name: Regenerate and verify
        if: steps.revision.outputs.skip != 'true' && steps.revision.outputs.existing_commit == ''
        run: |
          scripts/generate-swift.sh
          swift test
          swift build --configuration release

      - name: Commit and push the generated package update
        id: commit
        if: steps.revision.outputs.skip != 'true'
        env:
          PROTOCOL_SHA: ${{ steps.revision.outputs.sha }}
          EXISTING_COMMIT: ${{ steps.revision.outputs.existing_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "$EXISTING_COMMIT" ]]; then
            echo "sha=$EXISTING_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add Sources/BlueyeProtocol ProtocolDefinitions
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update protocol to ${PROTOCOL_SHA:0:12}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: update
    if: needs.update.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.commit }}

  release:
    needs: [update, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the shared version tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.update.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.update.outputs.commit }}
          PRERELEASE: ${{ needs.update.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already released"
            exit 0
          fi
          OPTIONS=()
          if [[ "$PRERELEASE" == "true" ]]; then OPTIONS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes "${OPTIONS[@]}"
